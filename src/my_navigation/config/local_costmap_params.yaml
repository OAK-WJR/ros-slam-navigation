local_costmap:
  global_frame: "odom"
  robot_base_frame: "base_link"
  update_frequency: 3.0
  publish_frequency: 2.5
  static_map: false
  transform_tolerance: 0.2
  track_unknown_space: false
  rolling_window: true
  width: 15.0
  height: 15.0
  resolution: 0.05

  plugins:
    - name: obstacle_layer
      type: "costmap_2d::ObstacleLayer"
    - name: inflation_layer
      type: "costmap_2d::InflationLayer"

  obstacle_layer:
    enabled: true
    observation_sources: laser_scan_sensor
    laser_scan_sensor:
      sensor_frame: "laser"
      data_type: "LaserScan"
      topic: "scan"
      marking: true
      clearing: true

  inflation_layer:
    enabled: true
    inflation_radius: 0.55
